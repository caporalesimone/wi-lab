# Wi-Lab Configuration File
# 
# This file defines WiFi Access Point networks and global settings.
# All comments provide detailed guidance for each parameter.
#
# IMPORTANT: Review and update parameters before starting Wi-Lab!

# ==================================================================================================
# API AUTHENTICATION
# ==================================================================================================

# Bearer token for REST API authentication
# This token must be sent with every API request (except /health endpoint)
# 
# SECURITY: Change this to a strong token!
# Generate a secure token with: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
auth_token: "secret-token-12345"

# ==================================================================================================
# API SERVER
# ==================================================================================================

# Port for REST API server
# A non-default value is now used by the server; update clients and proxies.
# API will be available at: http://localhost:8080
# Swagger UI docs at: http://localhost:8080/docs
api_port: 8080

# CORS allowed origins (for frontend development)
# If the field is not specified or empty (all entries are commented), 
# CORS is disabled (secure for production).
# For development with Angular frontend, uncomment and configure:
cors_origins:
   - "http://localhost:4200"       # Angular server - default
  # - "http://10.10.10.10:4200"    # Angular - Local PC
  # - "http://localhost:80"        # Production frontend (if served separately)
# 
# SECURITY: Only add trusted origins! Leaving this commented disables CORS (recommended for production)

# ==================================================================================================
# RESERVATION TIMEOUTS
# ==================================================================================================

# Maximum allowed reservation duration (upper bound for API requests)
# API requests with duration > max_timeout will be rejected.
# Set to 24 hours (86400 seconds) by default.
max_timeout: 86400

# Minimum allowed reservation duration (lower bound for API requests)
# API requests with duration < min_timeout will be rejected.
# Set to 60 seconds by default.
# NOTE: Hardcoded floor of 10 seconds — values below 10 are rejected at startup.
min_timeout: 60

# Allow unlimited (non-expiring) reservations
# When true, clients can send duration_seconds=0 to create a reservation
# that never expires. It must be released manually.
# When false, duration_seconds=0 is rejected with 422.
allow_unlimited_reservation: true

# ==================================================================================================
# DHCP & NETWORKING
# ==================================================================================================

# Base CIDR network for WiFi client DHCP allocation
# Wi-Lab assigns sequential subnets to each WiFi network:
#   1st network: 192.168.120.0/24 (gateway: .1, DHCP: .10-.250)
#   2nd network: 192.168.121.0/24 (gateway: .1, DHCP: .10-.250)
#   3rd network: 192.168.122.0/24 (gateway: .1, DHCP: .10-.250)
#
# If a subnet conflicts with the host network, Wi-Lab selects the next available /24.
dhcp_base_network: "192.168.120.0/24"

# Upstream interface for Internet access (NAT forwarding)
# This interface must have Internet access
# Options:
#   - "auto": Auto-detect via default gateway (RECOMMENDED - usually works)
#   - "eth0", "ens18", etc.: Force specific interface by name
upstream_interface: "auto"

# DNS server IP address for WiFi clients
# Clients will use this DNS for domain resolution
# Options:
#   - Use your local gateway: "192.168.10.1"
#   - Use local DNS server: "192.168.10.21"
#   - Use public google DNS: "8.8.8.8"
#   - Use public open DNS: "208.67.222.222"
dns_server: "208.67.222.222"

# Whether to enable Internet access by default for new networks
# - true: Clients can reach external networks (NAT enabled)
# - false: Clients isolated (no Internet access)
# Can be overridden per-network via API
internet_enabled_by_default: true

# ==================================================================================================
# REGULATORY DOMAIN
# ==================================================================================================

# ISO 3166-1 alpha-2 country code for WiFi regulatory domain
# Defines which channels and TX power levels are legally permitted.
# hostapd uses this to configure the radio — incorrect values may
# prevent AP creation on certain channels (especially 5 GHz).
# Use an actual country, not the region names EU, ETSI or FCC.
# JP is valid for Japan. Two-letter codes are checked for shape, not against
# the regulatory database; verify the active setting with `iw reg get`.
#
# Common country codes:
#   IT  - Italy              US  - United States
#   DE  - Germany            GB  - United Kingdom
#   FR  - France             ES  - Spain
#   JP  - Japan              CN  - China
#   KR  - South Korea        AU  - Australia
country_code: "IT"

# Whether Wi-Lab allows AP creation on channels that require DFS (5 GHz).
# DFS protects radar systems. Before an AP can transmit on a DFS channel, the
# radio may need to listen for radar, usually for about 60 seconds and on some
# frequencies for several minutes. Radar detected later can also interrupt an AP.
# - true: Allow DFS channels if the radio and local regulations permit them.
# - false (default, also if omitted): Exclude channels flagged for radar detection
#   by the radio. The available-channels API lists them as disabled, and requests for
#   those channels return HTTP 422 before starting the AP. No automatic fallback.
# Set to false for shorter, more predictable AP startup, at the cost of fewer
# 5 GHz channels. This does not turn off radar detection or override regulations.
# Restart Wi-Lab after changing this setting.
allow_dfs_channels: false

# ==================================================================================================
# WiFi DEVICES (auto-discovered)
# ==================================================================================================

# Wi-Lab discovers Wi-Fi interfaces automatically (`iw dev`) and manages each radio
# only after udev has finished initializing and naming its interface.
# Only AP-capable radios are managed, whether USB or built-in (PCI/SDIO). Interfaces carrying a
# default route and `upstream_interface` are never managed. A configured interface
# that is missing does not stop the service.
#
# This optional section only assigns a human-readable display_name to an interface.
# Discovered interfaces not listed here use the interface name as display_name.
# Listed interfaces are allocated DHCP subnets first, in this order; the others
# follow sorted by name.
#
# USB adapters are detected automatically from sysfs: on repeated radio faults Wi-Lab
# may reset the adapter's dedicated USB port (never a hub or shared device).
# Non-USB adapters get the same startup retries and quarantine, without port reset.
#
# Wi-Lab starts without antennas: discovery scans as soon as the API starts, then
# every 5 seconds while no antenna is available and every 30 seconds afterwards.
# Antennas plugged in later are added automatically, without a restart. Each scan
# re-reads this section, so new display names and disable flags apply to newly found
# antennas; antennas already in use are not changed until the service restarts.
#
#   - interface:    WiFi interface name (list them with: iw dev)
#   - display_name: Human-readable label shown in the API and UI
#                   (optional when disable is true)
#   - disable:      Optional, default false. When true, Wi-Lab never uses this radio
#                   (any interface on the same physical radio is excluded too)

networks:
  - interface: "wlxbc071dc527d6"
    display_name: "bench-antenna-1"

  - interface: "wlx7820512451b4"
    display_name: "bench-antenna-2"

  - interface: "wlx782051245264"
    display_name: "bench-antenna-3"

  # Example: keep the built-in card out of Wi-Lab
  # - interface: "wlan0"
  #   disable: true
