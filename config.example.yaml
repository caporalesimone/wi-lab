# Wi-Lab Configuration File
# 
# This file defines WiFi Access Point networks and global settings.
# All comments provide detailed guidance for each parameter.
#
# IMPORTANT: Review and update parameters before starting Wi-Lab!

# ==================================================================================================
# API AUTHENTICATION
# ==================================================================================================

# Bearer token for REST API authentication
# This token must be sent with every API request (except /health endpoint)
# 
# SECURITY: Change this to a strong token!
# Generate a secure token with: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
auth_token: "secret-token-12345"

# ==================================================================================================
# API SERVER
# ==================================================================================================

# Port for REST API server
# API will be available at: http://localhost:8080
# Swagger UI docs at: http://localhost:8080/docs
api_port: 8080

# CORS allowed origins (for frontend development)
# If the field is not specified or empty (all entries are commented), 
# CORS is disabled (secure for production).
# For development with Angular frontend, uncomment and configure:
cors_origins:
   - "http://localhost:4200"       # Angular server - default
  # - "http://10.10.10.10:4200"    # Angular - Local PC
  # - "http://localhost:80"        # Production frontend (if served separately)
# 
# SECURITY: Only add trusted origins! Leaving this commented disables CORS (recommended for production)

# ==================================================================================================
# RESERVATION TIMEOUTS
# ==================================================================================================

# Maximum allowed reservation duration (upper bound for API requests)
# API requests with duration > max_timeout will be rejected.
# Set to 24 hours (86400 seconds) by default.
max_timeout: 86400

# Minimum allowed reservation duration (lower bound for API requests)
# API requests with duration < min_timeout will be rejected.
# Set to 60 seconds by default.
# NOTE: Hardcoded floor of 10 seconds — values below 10 are rejected at startup.
min_timeout: 60

# Allow unlimited (non-expiring) reservations
# When true, clients can send duration_seconds=0 to create a reservation
# that never expires. It must be released manually.
# When false, duration_seconds=0 is rejected with 422.
allow_unlimited_reservation: true

# ==================================================================================================
# DHCP & NETWORKING
# ==================================================================================================

# Base CIDR network for WiFi client DHCP allocation
# Wi-Lab assigns sequential subnets to each WiFi network:
#   1st network: 192.168.120.0/24 (gateway: .1, DHCP: .10-.250)
#   2nd network: 192.168.121.0/24 (gateway: .1, DHCP: .10-.250)
#   3rd network: 192.168.122.0/24 (gateway: .1, DHCP: .10-.250)
#
# *** CRITICAL: Verify this subnet does NOT conflict with your host network! ***
# Check your host network: ip addr show | grep "inet "
# Example:
#   - If host is on 192.168.10.x: use 192.168.120.0/24 for WiFi ✅
#   - If host is on 192.168.10.x: DON'T use 192.168.10.0/24 for WiFi ❌
# Subnet conflict can BLOCK SSH access!
dhcp_base_network: "192.168.120.0/24"

# Upstream interface for Internet access (NAT forwarding)
# This interface must have Internet access
# Options:
#   - "auto": Auto-detect via default gateway (RECOMMENDED - usually works)
#   - "eth0", "ens18", etc.: Force specific interface by name
upstream_interface: "auto"

# DNS server IP address for WiFi clients
# Clients will use this DNS for domain resolution
# Options:
#   - Use your local gateway: "192.168.10.1"
#   - Use local DNS server: "192.168.10.21"
#   - Use public google DNS: "8.8.8.8"
#   - Use public open DNS: "208.67.222.222"
dns_server: "208.67.222.222"

# Whether to enable Internet access by default for new networks
# - true: Clients can reach external networks (NAT enabled)
# - false: Clients isolated (no Internet access)
# Can be overridden per-network via API
internet_enabled_by_default: true

# ==================================================================================================
# REGULATORY DOMAIN
# ==================================================================================================

# ISO 3166-1 alpha-2 country code for the WiFi regulatory domain.
# Defines which channels and TX power levels are legally permitted.
#
# The value is used in two places:
#   - "iw reg set <code>" at startup, so the kernel reports the right channel flags
#   - "country_code=" in the generated hostapd config, with ieee80211d=1
# Both require exactly TWO UPPERCASE LETTERS. Incorrect values may prevent AP
# creation on certain channels (especially 5 GHz).
#
# ⚠️ There is no region-wide value. Name the actual country:
#      ETSI  ❌ a DFS *region*, not a country (and not two letters)
#      FCC   ❌ same
#      EU    ❌ two letters, but no such country in the regulatory database
#      00    ❌ the kernel's "world domain"; legal for "iw reg set", refused here
#      JP    ✅ VALID — it is Japan. DFS-JP happens to share the name, but that
#               is a coincidence, not the reason it works
#
#    DFS regions (DFS-FCC, DFS-ETSI, DFS-JP) are DERIVED by the kernel from the
#    country: the database holds entries like "country IT: DFS-ETSI". You see the
#    region beside the country in "iw reg get" output — it is a consequence of
#    this field, never a replacement for it.
#
# ⚠️ Beyond the values named above, only the SHAPE is checked — not whether the
#    country exists. An unassigned but well-formed code (XY, ZZ) passes
#    validation; then "iw reg set" fails and is merely logged as a warning,
#    leaving the kernel on the world domain — the most restrictive one, which
#    disables much of 5 GHz.
#    After changing this value, always confirm with:  iw reg get
#
# Common country codes:
#   IT  - Italy              US  - United States      JP  - Japan
#   DE  - Germany            CA  - Canada             KR  - South Korea
#   FR  - France             MX  - Mexico             CN  - China
#   ES  - Spain              BR  - Brazil             IN  - India
#   GB  - United Kingdom     AR  - Argentina          AU  - Australia
#   NL  - Netherlands        CL  - Chile              NZ  - New Zealand
#   PL  - Poland                                      ZA  - South Africa
#   CH  - Switzerland
#   TR  - Turkey
#
# The full list your kernel accepts is in the wireless regulatory database:
#   https://git.kernel.org/pub/scm/linux/kernel/git/sforshee/wireless-regdb.git/tree/db.txt
country_code: "IT"

# ==================================================================================================
# MANAGED WiFi NETWORKS
# ==================================================================================================

# List of WiFi interfaces managed by Wi-Lab
# Each interface can run ONE WiFi network at a time
# 
# Parameters:
#   - interface: WiFi interface name to use for this network
#                Find available interfaces: iw dev
#                Names: wlan0, wlx782051245264, etc.
#                The interface name is also used as the internal device_id.
#
#   - display_name: Human-readable label for the device (required)
#                  Example: "bench-antenna-1"
#
#   - capabilities: What this device may be used for (required).
#                   Wi-Lab NEVER probes the hardware to fill these in and NEVER edits this
#                   file: capabilities are your declaration, not a measurement. You may
#                   legitimately declare "5ghz": false on a dual-band adapter to reserve
#                   that band for another bench.
#
#                   Valid ids: 2.4ghz, 5ghz
#                   EVERY id must be declared on EVERY device — a missing key is an error,
#                   not a silent false. At least one band must be true, or the device
#                   could never host an access point.
#
#                   Reservations can request capabilities; Wi-Lab then assigns the LEAST
#                   capable device that satisfies the request, so a dual-band adapter
#                   stays free for whoever actually needs 5 GHz.
#
# Validate this file at any time, without starting the service:
#   python3 main.py --validate-config
#
# For WiFi interface discovery:
#   List interfaces: iw dev
#   Check AP mode support: iw list | grep -A 5 "Supported interface modes"
#   Find interface name: iw dev (look for "Interface wlx..." lines)

networks:
  - interface: "wlxbc071dc527d6"
    display_name: "bench-antenna-1"
    capabilities:
      "2.4ghz": true
      "5ghz": false

  - interface: "wlx7820512451b4"
    display_name: "bench-antenna-2"
    capabilities:
      "2.4ghz": true
      "5ghz": true

  - interface: "wlx782051245264"
    display_name: "bench-antenna-3"
    capabilities:
      "2.4ghz": true
      "5ghz": true
