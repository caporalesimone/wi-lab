name: Clean up pull request runs

# Every day, delete the workflow runs of pull requests that are older than 24 hours, always
# keeping the 3 most recent runs of each pull request branch. Runs on main, runs for releases
# and manual/scheduled runs are never touched; release attachments are not workflow
# artifacts and are not affected. Run it manually with "dry run" ticked to see what it would do.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: true

permissions:
  actions: write   # delete workflow runs
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete old pull request runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/cleanup_pr_runs.py --repo "${{ github.repository }}" \
            --keep 3 --max-age-hours 24 \
            ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
