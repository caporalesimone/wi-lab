name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests, types and API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Validate example configuration
        run: .venv/bin/python main.py --validate-config --config config.example.yaml
      - name: Lint
        run: make lint
      - name: Type check
        run: make type-check
      - name: Test backend (with coverage)
        run: make test-local
      - name: Build offline API documentation
        run: .venv/bin/python scripts/export_api_docs.py --out api-docs
      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: wi-lab-api-docs-${{ github.sha }}
          path: api-docs/wi-lab-api-docs-*.zip
          if-no-files-found: error

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:prod
