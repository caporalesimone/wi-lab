name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, types, tests, config validation)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check wilab/ tests/
      - name: Type check
        run: mypy wilab/ tests/
      - name: Validate the example configuration
        run: python main.py --validate-config --config config.example.yaml
      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend (unit tests, production build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Production build
        run: npm run build:prod

  frontend-container:
    name: Frontend container image build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build frontend/Dockerfile
        run: docker build -t wi-lab-frontend:ci frontend

  api-docs:
    name: API docs bundle (builds; downloadable from the run)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Generate openapi.json, swagger.html and redoc.html
        run: python scripts/export_api_docs.py --out api-docs
      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: api-docs/wi-lab-api-docs-*.zip
