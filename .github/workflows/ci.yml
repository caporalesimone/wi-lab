name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, types, tests, config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check wilab/ tests/
      - name: Type check
        run: mypy wilab/ tests/
      - name: Validate the example configuration
        run: python main.py --validate-config --config config.example.yaml
      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend (unit tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Production build
        run: npm run build:prod

  frontend-container:
    name: Frontend container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend/Dockerfile
        run: docker build -t wi-lab-frontend:ci frontend
